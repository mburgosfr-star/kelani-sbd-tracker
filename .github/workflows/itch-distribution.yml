name: Sync published releases to itch.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published release tag to synchronize'
        required: true
        type: string

permissions:
  contents: read
  attestations: read

concurrency:
  group: itch-distribution
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'mburgosfr-star/kelani-sbd-tracker' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v') || startsWith(github.event.release.tag_name, 'ubuntu-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted upload tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install checksum-pinned Butler
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/itchio/butler/releases/download/v15.32.0/butler-linux-amd64.zip \
            --output "$RUNNER_TEMP/butler.zip"
          printf '%s  %s\n' '5db7b053fc9b578b86ffaf3520a12b952eb95c9225171cc5720dfbc9fe4574b3' "$RUNNER_TEMP/butler.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/butler"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/linux-amd64/butler"
          echo "BUTLER_BIN=$RUNNER_TEMP/butler/linux-amd64/butler" >> "$GITHUB_ENV"

      - name: Verify source and synchronize package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node scripts/sync-itch.cjs --tag "$RELEASE_TAG"
